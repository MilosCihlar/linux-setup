[window]
padding = { x = 8, y = 8 }
decorations = "none"

[font]
normal = { family = "Hack", style = "Regular" }
bold   = { family = "Hack", style = "Bold" }
italic = { family = "Hack", style = "Italic" }
size   = 12.0

[colors.primary]
background = "#17181a"
foreground = "#DBDBDB"

[colors.cursor]
text   = "#17181a"
cursor = "#ffffff"

[colors.normal]
black   = "#1C1C1C"
red     = "#B85335"
green   = "#79AD6A"
yellow  = "#FFB964"
blue    = "#667899"
magenta = "#A7A7FF"
cyan    = "#668799"
white   = "#E5E9F0"

[colors.bright]
black   = "#404040"
red     = "#CF6A4C"
green   = "#99DD6A"
yellow  = "#FAD07A"
blue    = "#8197BF"
magenta = "#C6B6EE"
cyan    = "#8FBFDC"
white   = "#8FBCBB"

[terminal]
shell = "/bin/zsh"
