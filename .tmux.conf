# ── Prefix ────────────────────────────────────────────────
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g default-command "zsh"

# ── Panes ─────────────────────────────────────────────────
bind 0 split-window -h -c "#{pane_current_path}"
bind 9 split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

bind r source-file ~/.tmux.conf

set -g base-index 1

bind -n C-h select-pane -R
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -L

bind -n C-M-h prev
bind -n C-M-l next

# ── Windows ───────────────────────────────────────────────
set -g mouse on
set-option -g allow-rename off
bind -n C-t new-window -c '#{pane_current_path}'
set -sg escape-time 0
set -g history-limit 10000

# ── Copy mode ─────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# ── Colors — edit here to retheme everything ──────────────
color_bg="#17181a"
color_fg="#DBDBDB"
color_blue="#667899"
color_blue_bright="#8197BF"
color_green="#79AD6A"
color_red="#B85335"
color_gray="#404040"
color_dark="#1C1C1C"

# ── Status bar ────────────────────────────────────────────
set-option -g status on
set-option -g status-style "bg=$color_bg,fg=$color_fg"
set-option -g status-justify left
set-option -g status-left-length 80
set-option -g status-right-length 80

set-option -g status-left "#[bg=$color_blue,fg=white] #S #[bg=$color_bg,fg=$color_blue,nobold]"
set-option -g status-right " %Y-%m-%d  %H:%M #[fg=$color_blue,bg=$color_bg]#[fg=white,bg=$color_blue] #h "

# ── Windows ───────────────────────────────────────────────
set-window-option -g window-status-separator ""
set-window-option -g window-status-style "bg=$color_bg,fg=$color_gray"
set-window-option -g window-status-format " #I #W "
set-window-option -g window-status-current-format "#[bg=$color_bg,fg=$color_blue]#[bg=$color_blue,fg=$color_green,bold] #I #W#{?window_zoomed_flag, *Z,} #[bg=$color_bg,fg=$color_blue]"
set-window-option -g window-status-activity-style "bg=$color_bg,fg=$color_red"

# ── Pane borders ──────────────────────────────────────────
set-option -g pane-border-style "fg=$color_dark"
set-option -g pane-active-border-style "fg=$color_blue"

# ── Messages ──────────────────────────────────────────────
set-option -g message-style "bg=$color_bg,fg=$color_fg"
set-option -g message-command-style "bg=$color_bg,fg=$color_fg"
set-option -g display-panes-colour "$color_blue"
set-option -g display-panes-active-colour "$color_red"

# ── Plugins ───────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'
