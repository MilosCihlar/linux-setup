; ── Colors — edit here to retheme everything ──────────────
[colors]
bg      = #17181a
fg      = #DBDBDB
blue    = #667899
green   = #79AD6A
red     = #B85335
yellow  = #FFB964
gray    = #404040
dark    = #1C1C1C

; ── Bar ───────────────────────────────────────────────────
[bar/main]
bottom           = true
width            = 100%
height           = 24
background       = ${colors.bg}
foreground       = ${colors.fg}

line-size        = 2
padding-left     = 1
padding-right    = 2
module-margin    = 1

font-0           = Hack:size=10;2

modules-left     = i3
modules-center   = date
modules-right    = network volume cpu

enable-ipc       = true

; ── i3 workspaces ─────────────────────────────────────────
[module/i3]
type                            = internal/i3
format                          = <label-state>

label-focused                   = %index%
label-focused-background        = ${colors.blue}
label-focused-foreground        = ${colors.fg}
label-focused-padding           = 2

label-unfocused                 = %index%
label-unfocused-foreground      = ${colors.gray}
label-unfocused-padding         = 2

label-visible                   = %index%
label-visible-foreground        = ${colors.fg}
label-visible-padding           = 2

label-urgent                    = %index%!
label-urgent-background         = ${colors.red}
label-urgent-foreground         = ${colors.fg}
label-urgent-padding            = 2

; ── Date & time ───────────────────────────────────────────
[module/date]
type     = internal/date
interval = 1
date     = %Y-%m-%d
time     = %H:%M:%S
label    = %date%  %time%

; ── Network ───────────────────────────────────────────────
[module/network]
type                = internal/network
interface           = enp86s0
interval            = 3
format-connected    = NET %{F#79AD6A}UP%{F-} %downspeed% ↓ %upspeed% ↑
format-disconnected = NET %{F#B85335}DOWN%{F-}

; ── Volume ────────────────────────────────────────────────
[module/volume]
type                   = internal/pulseaudio
format-volume          = VOL %percentage%%
label-muted            = VOL MUTED
label-muted-foreground = ${colors.gray}

; ── CPU ───────────────────────────────────────────────────
[module/cpu]
type          = internal/cpu
interval      = 2
format-prefix = "CPU "
label         = %percentage:2%%
